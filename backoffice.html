<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة التحرير - مجلتي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #fff5f7; }
        .cute-card {
            border-radius: 30px;
            background: white;
            box-shadow: 0 10px 30px rgba(255, 182, 193, 0.2);
            border: 2px solid #ffe4e8;
        }
        .marker-input {
            background: linear-gradient(120deg, rgba(255, 230, 0, 0.2) 0%, rgba(255, 230, 0, 0.2) 100%);
            border-radius: 5px;
        }
        .btn-publish {
            background: #ff8fa3;
            transition: all 0.3s ease;
            border-radius: 20px;
        }
        .btn-publish:hover {
            background: #ff4d6d;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.3);
        }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-10 bg-white p-6 rounded-[25px] shadow-sm border-b-4 border-pink-200">
            <h1 class="text-2xl font-black text-pink-600">✨ إضافة مقال جديد</h1>
            <button onclick="publierArticle()" class="btn-publish text-white px-10 py-3 font-bold text-lg">نشر الآن</button>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <div class="lg:col-span-2 space-y-6">
                <div class="cute-card p-8">
                    <label class="block text-pink-400 font-bold mb-2 mr-2">العنوان الرائع</label>
                    <input type="text" id="title" class="w-full text-3xl font-black border-none focus:ring-0 placeholder-gray-200 mb-6" placeholder="اكتب العنوان هنا...">
                    
                    <label class="block text-pink-400 font-bold mb-2 mr-2">المقدمة (Lead)</label>
                    <div class="relative mb-8">
                        <textarea id="lead" class="w-full text-lg text-gray-600 marker-input border-none focus:ring-0 p-4 min-h-[120px]" placeholder="اكتب المقدمة القصيرة هنا..."></textarea>
                    </div>

                    <label class="block text-pink-400 font-bold mb-2 mr-2">نص المقال الكامل</label>
                    <textarea id="content" class="w-full min-h-[350px] border-2 border-pink-50 rounded-[25px] p-6 focus:border-pink-200 outline-none transition-colors text-gray-700 leading-relaxed" placeholder="ابدأ بكتابة قصتك الكاملة..."></textarea>
                </div>
            </div>

            <aside class="space-y-6">
                <div class="cute-card p-6">
                    <h3 class="font-bold text-gray-700 mb-4 border-r-4 border-pink-400 pr-3">تصنيف المقال</h3>
                    <div class="flex flex-wrap gap-2" id="cat-list">
                        <button onclick="selectCat(this, '#6ebfb5')" class="cat-btn px-4 py-2 border-2 border-[#6ebfb5] rounded-full text-sm font-bold transition-all">سينما</button>
                        <button onclick="selectCat(this, '#ffcc5c')" class="cat-btn px-4 py-2 border-2 border-[#ffcc5c] rounded-full text-sm font-bold transition-all">فنون</button>
                        <button onclick="selectCat(this, '#ff9a9e')" class="cat-btn px-4 py-2 border-2 border-[#ff9a9e] rounded-full text-sm font-bold transition-all">أدب</button>
                    </div>
                </div>

                <div class="cute-card p-6">
                    <h3 class="font-bold text-gray-700 mb-4 border-r-4 border-pink-400 pr-3">رابط الصورة</h3>
                    <input type="text" id="image_url" class="w-full bg-gray-50 border-none rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-pink-200" placeholder="ضع رابط الصورة هنا...">
                </div>

                <div class="bg-zinc-900 rounded-[30px] p-6 text-white shadow-xl">
                    <h3 class="text-xs font-bold mb-4 opacity-50 uppercase tracking-widest text-center">معاينة محرك البحث</h3>
                    <div class="bg-white p-4 rounded-2xl text-left" dir="ltr">
                        <div id="seo-title" class="text-blue-600 text-lg font-medium truncate">Titre...</div>
                        <div class="text-green-700 text-xs py-1">ma-revue.com > article</div>
                        <div id="seo-lead" class="text-gray-500 text-xs line-clamp-2">Résumé...</div>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <script>
        // 1. CONFIGURATION SUPABASE (À remplir !)
        const SUPABASE_URL = 'https://hacqiedexiauluyzmweb.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_MYE26bL12o0KCBK9rwujRQ_T_u_CB47';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let selectedCategory = "";

        // 2. Gestion de la sélection de catégorie
        function selectCat(btn, color) {
            document.querySelectorAll('.cat-btn').forEach(b => {
                b.style.backgroundColor = 'transparent';
                b.style.color = 'black';
            });
            btn.style.backgroundColor = color;
            btn.style.color = 'white';
            selectedCategory = btn.innerText;
        }

        // 3. Mise à jour automatique de l'aperçu SEO
        document.getElementById('title').addEventListener('input', (e) => {
            document.getElementById('seo-title').innerText = e.target.value || "Titre...";
        });
        document.getElementById('lead').addEventListener('input', (e) => {
            document.getElementById('seo-lead').innerText = e.target.value || "Résumé...";
        });

        // 4. FONCTION DE PUBLICATION RÉELLE
        async function publierArticle() {
            const title = document.getElementById('title').value;
            const lead = document.getElementById('lead').value;
            const content = document.getElementById('content').value;
            const image_url = document.getElementById('image_url').value || "https://images.unsplash.com/photo-1547826039-bfc35e0f1ea8";

            if(!title || !lead || !selectedCategory) {
                alert("لطفاً، أكمل العنوان والمقدمة واختر تصنيفاً!");
                return;
            }

            // Envoi à Supabase
            const { data, error } = await _supabase
                .from('articles')
                .insert([
                    { 
                        title: title, 
                        lead: lead, 
                        content: content,
                        category: selectedCategory,
                        image_url: image_url,
                        block_number: 0 // Par défaut, en attente de placement
                    }
                ]);

            if (error) {
                alert('خطأ أثناء النشر: ' + error.message);
            } else {
                alert('✨ تم نشر مقالك بنجاح وهو الآن عند المشرف!');
                // Reset du formulaire
                document.getElementById('title').value = '';
                document.getElementById('lead').value = '';
                document.getElementById('content').value = '';
                document.getElementById('image_url').value = '';
            }
        }
    </script>
</body>
</html>
