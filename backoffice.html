<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interface Redacteur - Magazine Culturel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #fff5f7; }
        .marker-effect {
            background: linear-gradient(120deg, rgba(255, 230, 0, 0.3) 0%, rgba(255, 230, 0, 0.3) 100%);
            border-radius: 2px;
        }
        .cute-card {
            border-radius: 25px;
            background: white;
            box-shadow: 0 10px 25px rgba(255, 182, 193, 0.2);
            border: 2px solid #ffe4e8;
        }
        .btn-cute {
            background: #ff8fa3;
            transition: all 0.3s ease;
            border-radius: 15px;
        }
        .btn-cute:hover {
            background: #ff4d6d;
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-8 bg-white p-6 rounded-3xl shadow-sm border-b-4 border-pink-200">
            <h1 class="text-2xl font-bold text-pink-600">✨ منصة التحرير (Back-office)</h1>
            <button class="btn-cute text-white px-8 py-2 font-bold shadow-md">نشر المقال</button>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <div class="lg:col-span-2 space-y-6">
                <div class="cute-card p-8">
                    <input type="text" id="title" class="w-full text-3xl font-bold border-none focus:ring-0 placeholder-gray-200 mb-6 text-gray-800" placeholder="اكتب العنوان هنا...">
                    
                    <div class="relative mb-8">
                        <textarea id="lead" class="w-full text-lg text-gray-600 marker-effect border-none focus:ring-0 p-4 min-h-[100px]" placeholder="اكتب المقدمة (Lead) التي ستظهر بجانب الصورة..."></textarea>
                    </div>

                    <div class="border-t pt-6">
                        <label class="block text-sm text-gray-400 mb-2 font-bold italic">نص المقال الكامل (Corps de l'article)</label>
                        <textarea class="w-full min-h-[300px] border-2 border-pink-50 rounded-2xl p-4 focus:border-pink-200 outline-none transition-colors" placeholder="ابدأ كتابة قصتك هنا..."></textarea>
                    </div>
                </div>
            </div>

            <aside class="space-y-6">
                <div class="cute-card p-6">
                    <h3 class="font-bold text-gray-700 mb-4 border-r-4 border-pink-400 pr-2">التصنيف (Portails)</h3>
                    <div class="flex flex-wrap gap-2 mb-4" id="cat-list">
                        <button onclick="selectCat(this, '#6ebfb5')" class="px-4 py-2 border-2 border-[#6ebfb5] rounded-xl text-sm transition-all hover:bg-[#6ebfb5] hover:text-white">سينما</button>
                        <button onclick="selectCat(this, '#ffcc5c')" class="px-4 py-2 border-2 border-[#ffcc5c] rounded-xl text-sm transition-all hover:bg-[#ffcc5c] hover:text-white">فنون</button>
                        <button onclick="selectCat(this, '#ff9a9e')" class="px-4 py-2 border-2 border-[#ff9a9e] rounded-xl text-sm transition-all hover:bg-[#ff9a9e] hover:text-white">أدب</button>
                    </div>
                    <div class="mt-4 p-3 bg-pink-50 rounded-xl">
                        <label class="text-xs text-pink-400 block mb-1">لون مخصص</label>
                        <input type="color" id="colorPicker" onchange="updateCustomColor(this.value)" class="w-full h-8 rounded-lg cursor-pointer">
                    </div>
                </div>

                <div class="cute-card p-6">
                    <h3 class="font-bold text-gray-700 mb-4 border-r-4 border-pink-400 pr-2">الوسائط</h3>
                    <div class="border-2 border-dashed border-pink-100 rounded-2xl p-6 text-center cursor-pointer hover:bg-pink-50 transition-all">
                        <div class="text-3xl mb-2">📸</div>
                        <p class="text-xs text-gray-400">اسحب الصورة أو الفيديو هنا</p>
                    </div>
                </div>

                <div class="bg-gray-900 rounded-[25px] p-6 text-white shadow-2xl overflow-hidden relative">
                    <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-pink-500 to-yellow-500"></div>
                    <h3 class="text-sm font-bold mb-4 opacity-50">معاينة محرك البحث Google</h3>
                    <div class="bg-white p-4 rounded-xl text-left" dir="ltr">
                        <div id="seo-preview-title" class="text-blue-600 text-lg hover:underline cursor-pointer truncate">Titre de l'article...</div>
                        <div class="text-green-700 text-sm py-1">magazine.com > article</div>
                        <div id="seo-preview-lead" class="text-gray-600 text-sm line-clamp-2">Le résumé apparaîtra ici pour attirer les lecteurs...</div>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <script>
        // Logique pour les catégories
        function selectCat(btn, color) {
            document.querySelectorAll('#cat-list button').forEach(b => {
                b.style.backgroundColor = 'transparent';
                b.style.color = 'black';
            });
            btn.style.backgroundColor = color;
            btn.style.color = 'white';
        }

        // Logique SEO temps réel
        const titleInput = document.getElementById('title');
        const leadInput = document.getElementById('lead');
        const seoTitle = document.getElementById('seo-preview-title');
        const seoLead = document.getElementById('seo-preview-lead');

        titleInput.addEventListener('input', () => {
            seoTitle.innerText = titleInput.value || "Titre de l'article...";
        });

        leadInput.addEventListener('input', () => {
            seoLead.innerText = leadInput.value || "Le résumé apparaîtra ici...";
        });
    </script>
</body>
</html>
